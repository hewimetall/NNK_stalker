[package]
name = "nnk_client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy presentation client (native + WASM)"

[lib]
crate-type = ["cdylib", "rlib"]
name = "nnk_client"

[[bin]]
name = "nnk_client"
path = "src/main.rs"

[dependencies]
nnk_domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "png",
    "x11",
    "default_font",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
